<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aletheia 真實島</title>
<meta name="description" content="Aletheia 真實引擎協議的運作機制,做成一座 3D 六角島城市:12 座島、67 棟建物、12 條協作線,小人搬著題目、答案和分數在島之間走,訪客搭渡輪從碼頭上岸參與評測。">
<style>
/* 版面:全螢幕 3D 島城,左上品牌卡與工具列,左側詳細卡,右側清單與日誌,底部時段 HUD。黏土微縮城市,單一淺色介面 */
:root {
  --ink:#211d1d; --coral:#db6a41; --cream:#fff8f4; --yellow:#fcea8b; --stone:#c5b5a7; --green:#71806a;
  --paper:rgba(255,251,246,.88); --line:#eadfd3; --muted:#7b6f66; --soft:#f6efe7;
  --ok:#4f8a5b; --doing:#c98a12; --todo:#9b8f86;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --num:Georgia,"Times New Roman",serif;
  --shadow:0 1px 2px #4a2a1414, 0 8px 24px #4a2a141f, 0 24px 60px #4a2a1414;
  color-scheme:light;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; margin:0; }
body { background:radial-gradient(120% 90% at 50% 20%, #fffdf9, #edddcf); color:var(--ink); font:14px/1.6 var(--sans); overflow:hidden; }
button { font:inherit; color:inherit; }
:focus-visible { outline:3px solid var(--coral); outline-offset:2px; }
#stage { position:fixed; inset:0; }
#stage canvas { display:block; touch-action:none; }
.labels { position:absolute; inset:0; pointer-events:none; }
.eyebrow { font:700 10px/1.4 var(--mono); letter-spacing:2px; color:var(--muted); text-transform:uppercase; }

/* 載入 */
#loader { position:fixed; inset:0; z-index:50; display:grid; place-content:center; text-align:center; gap:10px;
  background:radial-gradient(120% 90% at 50% 20%, #fffdf9, #edddcf); transition:opacity .6s; }
#loader.done { opacity:0; pointer-events:none; }
#loader b { font:800 clamp(2.4rem,7vw,4rem)/1 var(--sans); letter-spacing:-.02em; }
#loader b span { color:var(--coral); }
#loadMsg { color:var(--muted); max-width:28em; padding-inline:16px; }
#loadMsg.err { color:#a3321a; }

/* 面板共用 */
.panel { position:fixed; z-index:10; background:var(--paper); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-radius:18px; box-shadow:var(--shadow); }
.btn { min-height:44px; min-width:44px; padding:0 14px; border:0; border-radius:9px; background:var(--cream); cursor:pointer;
  box-shadow:0 2px 8px #4a2a1414; font-weight:700; transition:background .15s; }
.btn:hover { background:var(--yellow); }
.btn[aria-pressed="true"] { background:var(--ink); color:var(--cream); }
.chip { display:inline-flex; align-items:center; gap:6px; border:0; border-radius:999px; padding:4px 11px; background:#fff;
  box-shadow:0 2px 8px #4a2a1414; font-size:12px; cursor:pointer; white-space:nowrap; }
.chip:hover { background:var(--yellow); }
.chip i { width:8px; height:8px; border-radius:50%; background:var(--c,var(--coral)); }

#brand { left:max(16px, env(safe-area-inset-left, 0px)); top:calc(16px + env(safe-area-inset-top, 0px)); padding:14px 18px 12px; width:300px; }
#brand h1 { margin:2px 0 0; font:800 30px/1.1 var(--sans); letter-spacing:-.02em; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
#brand h1 small { font-size:15px; font-weight:800; color:var(--coral); letter-spacing:0; }
#brand h1 small::before { content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--coral); margin-right:6px; vertical-align:1px; }
#stats { margin:4px 0 0; color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
#tools { position:fixed; z-index:10; left:max(16px, env(safe-area-inset-left, 0px)); top:calc(132px + env(safe-area-inset-top, 0px)); display:flex; gap:8px; }

/* 左側詳細卡 */
#card { left:max(16px, env(safe-area-inset-left, 0px)); top:calc(192px + env(safe-area-inset-top, 0px)); bottom:96px; width:340px; border-radius:22px; display:flex; flex-direction:column; overflow:hidden; }
#card .x { position:absolute; right:10px; top:10px; z-index:2; }
#cardBody { overflow-y:auto; padding:18px 20px 22px; overscroll-behavior:contain; }
#cardBody h2 { margin:4px 44px 10px 0; font:800 22px/1.3 var(--sans); text-wrap:balance; }
#cardBody h3 { margin:18px 0 8px; font:700 10px/1.4 var(--mono); letter-spacing:2px; color:var(--muted); }
#cardBody p { margin:0 0 10px; }
.ib { display:inline-grid; place-items:center; width:30px; height:30px; margin-right:8px; border-radius:9px; background:var(--c); color:#fff;
  font:800 13px/1 var(--mono); vertical-align:3px; clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%); }
.thumb { display:block; width:160px; height:160px; margin:6px auto 12px; border-radius:16px; background:var(--soft); }
.tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(84px,1fr)); gap:8px; margin:10px 0; }
.tile { background:var(--soft); border-radius:12px; padding:8px 10px; min-width:0; }
.tile b { display:block; font:italic 700 24px/1.1 var(--num); color:var(--coral); }
.tile small { display:block; color:var(--muted); font-size:11px; line-height:1.4; }
.facts { margin:0; padding:0 0 0 18px; }
.facts li { margin:3px 0; }
.list { list-style:none; margin:0; padding:0; }
.list button { display:grid; grid-template-columns:24px 1fr auto; gap:8px; align-items:center; width:100%; min-height:44px; padding:6px 6px; border:0;
  border-bottom:1px solid var(--line); background:none; text-align:left; cursor:pointer; border-radius:8px; }
.list button:hover, .list button[aria-current="true"], #sideList summary[aria-current="true"] { background:var(--yellow); }
.list .n { display:grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--coral); color:#fff; font:700 11px/1 var(--mono); }
.list small { display:block; color:var(--muted); font-size:12px; line-height:1.45; }
.st { font-size:11px; padding:1px 8px; border-radius:999px; border:1px solid currentColor; white-space:nowrap; }
.st.s2 { color:var(--ok); } .st.s1 { color:var(--doing); } .st.s0 { color:var(--todo); }
.timeline { display:flex; justify-content:space-between; position:relative; margin:10px 4px 4px; }
.timeline::before { content:""; position:absolute; left:8px; right:8px; top:6px; height:2px; background:var(--line); }
.timeline span { position:relative; display:grid; justify-items:center; gap:4px; font-size:12px; color:var(--muted); }
.timeline span::before { content:""; width:12px; height:12px; border-radius:50%; background:var(--line); }
.timeline span.on { color:var(--ink); font-weight:700; }
.timeline span.on::before { background:var(--coral); box-shadow:0 0 0 4px #db6a4133; }
.busy { display:inline-flex; gap:6px; align-items:center; margin:12px 0 0; padding:6px 12px; border-radius:999px; background:var(--yellow); font-weight:700; font-size:12px; }
.fwbtn { margin:12px 0 0; }
.busy::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--ink); }
.evi { display:inline-block; margin:2px 0 8px; padding:3px 10px; border-radius:8px; font-size:12px; font-weight:700; }
.evi.e-yes { background:#dff0dd; color:#2f6b3a; } .evi.e-no { background:#f9e0d6; color:#9a3b1c; } .evi.e-na { background:var(--soft); color:var(--muted); }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.route { display:flex; align-items:center; gap:8px; margin:10px 0; }
.route .ln { flex:1; height:0; border-top:3px solid var(--coral); }
.route .ln.thematic { border-top-style:dashed; } .route .ln.pending { border-top-style:dotted; }
dl.kv { display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:12px 0 0; }
dl.kv dt { color:var(--muted); } dl.kv dd { margin:0; font-weight:700; }
.kpis { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.kpis b { font:italic 700 18px/1 var(--num); color:var(--ink); margin-right:3px; }

/* 右側清單 */
#side { right:max(16px, env(safe-area-inset-right, 0px)); top:calc(16px + env(safe-area-inset-top, 0px)); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); width:318px; display:flex; flex-direction:column; padding:14px 12px 8px; }
#side[hidden] { display:none; }
#search { width:100%; min-height:44px; border:1px solid var(--line); border-radius:12px; padding:0 14px; background:#fff; font:inherit; }
.tabs { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:10px 0 8px; }
#sideList { overflow-y:auto; flex:1; padding-right:2px; overscroll-behavior:contain; }
#sideList details { border-bottom:1px solid var(--line); }
#sideList summary { display:grid; grid-template-columns:30px 1fr auto; align-items:center; gap:8px; min-height:46px; cursor:pointer; list-style:none; padding:0 4px; border-radius:8px; }
#sideList summary::-webkit-details-marker { display:none; }
#sideList summary:hover { background:var(--soft); }
#sideList summary .ib { width:26px; height:26px; margin:0; font-size:11px; }
#sideList summary b { font-weight:700; }
#sideList summary small { color:var(--muted); font-variant-numeric:tabular-nums; }
#sideList details .list { padding:0 0 6px 18px; }
#sideList details .list button { min-height:38px; border-bottom:0; }
#sideList .empty { color:var(--muted); padding:20px 6px; }

/* 日誌 */
#log { right:calc(346px + env(safe-area-inset-right, 0px)); top:calc(16px + env(safe-area-inset-top, 0px)); width:296px; max-height:44vh; display:flex; flex-direction:column; padding:12px 12px 6px; border-radius:16px; }
#log[hidden] { display:none; }
#log header { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
#log header b { font-weight:800; }
.live { font:700 10px/1 var(--mono); letter-spacing:2px; color:#2f8a4b; }
.live::before { content:"●"; margin-right:4px; animation:blink 1.6s infinite; }
@keyframes blink { 50% { opacity:.25; } }
#logFilter { margin-left:auto; min-height:32px; max-width:130px; border:1px solid var(--line); border-radius:8px; background:#fff; font:inherit; font-size:12px; }
#logList { list-style:none; margin:0; padding:0; overflow-y:auto; font-size:12px; overscroll-behavior:contain; }
#logList li { display:grid; grid-template-columns:40px auto 1fr; gap:6px; padding:5px 0; border-bottom:1px solid var(--line); align-items:baseline; }
#logList time { font:12px/1.4 var(--mono); color:var(--muted); font-variant-numeric:tabular-nums; }
#logList .tag { font-size:10px; font-weight:700; padding:0 6px; border-radius:6px; background:var(--soft); white-space:nowrap; }
#logList .t-arrive { background:#e6f0ec; color:#2f6b4f; } #logList .t-handoff { background:#fde9df; color:#9a3b1c; }
#logList .t-stop { background:#fff1c2; color:#7a5a00; } #logList .t-depart { background:#ecebf6; color:#4b4f8a; } #logList .t-commit { background:var(--yellow); color:var(--ink); }

/* HUD */
#hud { left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:16px; }
#hud .clock { display:grid; padding:0 10px 0 6px; min-width:86px; }
#hud .clock b { font:italic 700 24px/1 var(--num); font-variant-numeric:tabular-nums; }
#hud .clock small { color:var(--muted); font-size:11px; white-space:nowrap; }
#hud .sep { width:1px; align-self:stretch; background:var(--line); margin:4px 4px; }
#hud .btn { padding:0 10px; font-size:12px; }
#hud .tg { display:grid; justify-items:center; gap:0; min-width:52px; padding:4px 6px; line-height:1.1; font-size:11px; }
#hud .tg span { font-size:16px; line-height:1.1; }
#hudToggle { display:none; }

#legend { left:50%; transform:translateX(-50%); bottom:calc(86px + env(safe-area-inset-bottom, 0px)); display:flex; gap:16px; padding:8px 16px; border-radius:999px; font-size:12px; }
#legend[hidden] { display:none; }
#legend span { display:inline-flex; align-items:center; gap:6px; }
#legend i { width:26px; border-top:3px solid var(--coral); }
#legend i.thematic { border-top-style:dashed; } #legend i.pending { border-top-style:dotted; }

/* 3D 標籤 */
.ilabel { pointer-events:auto; display:inline-flex; align-items:center; gap:6px; padding:4px 11px 4px 5px; border:0; border-radius:999px; background:#fffdf9;
  box-shadow:0 2px 8px #4a2a1426; font:700 12px/1.2 var(--sans); cursor:pointer; white-space:nowrap; transition:opacity .2s; }
.ilabel em { font:700 10px/1 var(--mono); font-style:normal; color:#fff; background:var(--c); border-radius:999px; padding:4px 6px; }
.ilabel:hover { background:var(--yellow); }
.ilabel.sel { background:var(--ink); color:var(--cream); }
.ilabel.dim { opacity:.45; }
.ilabel.num span { display:none; }
.ilabel.num { padding-right:5px; }
.ilabel.gone { opacity:0; pointer-events:none; }
.pin { pointer-events:auto; display:grid; place-items:center; width:24px; height:24px; border:2px solid #fff; border-radius:50%; background:var(--coral); color:#fff;
  font:700 12px/1 var(--sans); box-shadow:0 2px 6px #4a2a1440; cursor:pointer; }
.pin.on { background:var(--ink); }
.bubble { padding:3px 8px; border-radius:10px; background:#fff; box-shadow:0 2px 6px #4a2a1426; font-size:11px; white-space:nowrap; transform:translateY(-6px); }

/* 說明 */
#intro { position:fixed; inset:0; z-index:40; display:grid; place-items:center; background:#211d1d55; padding:16px; }
#intro[hidden] { display:none; }
#intro .box { background:var(--cream); border-radius:22px; padding:24px 24px 20px; max-width:420px; box-shadow:var(--shadow); }
#intro h2 { margin:6px 0 14px; font:800 22px/1.3 var(--sans); }
#intro ol { margin:0 0 18px; padding:0; list-style:none; display:grid; gap:12px; counter-reset:s; }
#intro li { counter-increment:s; display:grid; grid-template-columns:34px 1fr; gap:10px; align-items:start; }
#intro li::before { content:counter(s); display:grid; place-items:center; width:30px; height:30px; border-radius:50%; background:var(--coral); color:#fff; font:italic 700 16px/1 var(--num); }
#intro li b { display:block; }
#intro li small { color:var(--muted); }
.sheet-handle { display:none; }

@media (max-width:1180px) { #log { right:auto; left:max(372px, calc(16px + env(safe-area-inset-left, 0px))); top:auto; bottom:96px; max-height:30vh; } }
@media (max-width:800px) {
  #brand { width:auto; right:calc(76px + env(safe-area-inset-right, 0px)); padding:10px 14px; }
  #brand h1 { font-size:22px; } #brand h1 small { font-size:13px; }
  #brand .eyebrow, #stats { display:none; }
  #tools { left:auto; right:max(12px, env(safe-area-inset-right, 0px)); top:calc(12px + env(safe-area-inset-top, 0px)); flex-direction:column; }
  #side, #card { left:0; right:0; top:auto; bottom:0; width:auto; border-radius:20px 20px 0 0; padding-bottom:env(safe-area-inset-bottom, 0px);
    padding-left:max(12px, env(safe-area-inset-left, 0px)); padding-right:max(12px, env(safe-area-inset-right, 0px)); }
  #side { height:52%; z-index:12; }
  #card { height:34%; z-index:13; }
  .sheet-handle { display:block; width:100%; height:22px; border:0; background:none; cursor:ns-resize; touch-action:none; flex:none; }
  .sheet-handle::before { content:""; display:block; width:44px; height:5px; margin:8px auto 0; border-radius:3px; background:#cbbfb3; }
  #cardBody { padding-top:4px; }
  #log { left:max(12px, env(safe-area-inset-left, 0px)); right:max(12px, env(safe-area-inset-right, 0px)); width:auto; top:calc(72px + env(safe-area-inset-top, 0px)); bottom:auto; max-height:30vh; }
  #hud { display:none; flex-wrap:wrap; justify-content:center; left:max(12px, env(safe-area-inset-left, 0px)); right:max(12px, env(safe-area-inset-right, 0px)); transform:none; bottom:calc(72px + env(safe-area-inset-bottom, 0px)); }
  #hud.open { display:flex; }
  #hud .sep { display:none; }
  #hudToggle { display:block; position:fixed; z-index:11; left:max(12px, env(safe-area-inset-left, 0px)); bottom:calc(16px + env(safe-area-inset-bottom, 0px)); }
  #legend { bottom:calc(132px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { .live::before { animation:none; } #loader, .ilabel { transition:none; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage" aria-label="Aletheia 真實島 3D 場景"></div>

<div id="loader" role="status"><b>Aletheia <span>真實島</span></b><div id="loadMsg">正在組合真實島…</div></div>

<header id="brand" class="panel">
  <div class="eyebrow">誠實協議 · 測評循環 · 公開數據</div>
  <h1>Aletheia <small>真實島 · v2.4</small></h1>
  <p id="stats"></p>
</header>
<nav id="tools" aria-label="視角與面板">
  <button class="btn" id="btnHome" type="button">全景</button>
  <button class="btn" id="btnList" type="button" aria-pressed="true">清單</button>
  <button class="btn" id="btnHelp" type="button" aria-label="操作說明">?</button>
</nav>

<aside id="card" class="panel" hidden aria-live="polite">
  <button class="sheet-handle" type="button" aria-label="調整卡片高度"></button>
  <button class="btn x" id="cardClose" type="button" aria-label="關閉卡片">×</button>
  <div id="cardBody"></div>
</aside>

<aside id="side" class="panel" aria-label="島嶼清單">
  <button class="sheet-handle" type="button" aria-label="調整清單高度"></button>
  <input id="search" type="search" placeholder="搜尋島嶼、原則、題目…" autocomplete="off">
  <div class="tabs" role="tablist">
    <button class="btn" id="tabTopics" type="button" role="tab" aria-pressed="true">島嶼主題</button>
    <button class="btn" id="tabFlows" type="button" role="tab" aria-pressed="false">協作關係</button>
  </div>
  <div id="sideList"></div>
</aside>

<section id="log" class="panel" aria-label="島嶼日誌">
  <header><b>島嶼日誌</b><span class="live">LIVE</span>
    <select id="logFilter" aria-label="依協作線篩選"><option value="">全部</option></select></header>
  <ol id="logList"></ol>
</section>

<div id="legend" class="panel" hidden>
  <span><i></i>固定運作</span><span><i class="thematic"></i>不定期</span><span><i class="pending"></i>規劃中</span>
</div>

<div id="hud" class="panel" role="toolbar" aria-label="時間與顯示">
  <div class="clock"><b id="clock">10:00</b><small id="phase"></small></div>
  <button class="btn" type="button" data-time="360">清晨 06</button>
  <button class="btn" type="button" data-time="720">白天 12</button>
  <button class="btn" type="button" data-time="1080">黃昏 18</button>
  <button class="btn" type="button" data-time="1260">夜晚 21</button>
  <div class="sep"></div>
  <button class="btn tg" type="button" data-tog="names" aria-pressed="false"><span>◎</span>名牌</button>
  <button class="btn tg" type="button" data-tog="carry" aria-pressed="true"><span>▣</span>搬運</button>
  <button class="btn tg" type="button" data-tog="flows" aria-pressed="false"><span>⇢</span>協作線</button>
  <button class="btn tg" type="button" data-tog="paused" aria-pressed="false"><span>Ⅱ</span>暫停</button>
  <button class="btn tg" type="button" data-tog="bird" aria-pressed="false"><span>⊙</span>鳥瞰</button>
  <button class="btn tg" type="button" data-tog="log" aria-pressed="true"><span>☰</span>日誌</button>
  <button class="btn tg" type="button" data-tog="fireworks" aria-pressed="true"><span>✺</span>煙火</button>
</div>
<button class="btn" id="hudToggle" type="button" aria-expanded="false">◷ 時間</button>

<div id="intro" hidden role="dialog" aria-modal="true" aria-labelledby="introTitle">
  <div class="box">
    <div class="eyebrow">怎麼逛這座島</div>
    <h2 id="introTitle">Aletheia 的每一步,都是一座島</h2>
    <ol>

        <span class="n" style="background:${hb.color}">⚓</span><span>${esc(hb.name)}<small>訪客搭船上岸,親自參與評測</small></span><span class="st s1">開放</span></button></li></ol>` : "";
      const bkRow = hit(bk.name) || hit(bk.desc) || hit("燈塔") ? `<ol class="list"><li><button type="button" data-key="beacon" data-beacon>
        <span class="n" style="background:${bk.color}">燈</span><span>${esc(bk.name)}<small>碼頭外海的礁石小島</small></span><span class="st s2">已上線</span></button></li></ol>` : "";
      box.innerHTML = (hbRow + bkRow + html) || `<p class="empty">找不到「${esc(q)}」。試試「P11」「題庫」或「94%」。</p>`;
    } else {
      const fl = flows.filter(f => hit(f.cargo) || f.route.some(r => hit(r.name)) || hit(f.role));
      box.innerHTML = fl.length ? `<ol class="list">${fl.map(f => `<li><button type="button" data-key="f${f.index}" data-flow="${f.index}"><span class="n" style="background:${f.B.color}">${f.index + 1}</span>
        <span>${f.route.map(r => esc(r.name)).join(" → ")}<small>${esc(f.role)}搬${esc(f.cargo)}</small></span><span class="st ${f.level === "pending" ? "s0" : f.level === "thematic" ? "s1" : "s2"}">${LEVELS[f.level]}</span></button></li>`).join("")}</ol>`
        : `<p class="empty">找不到「${esc(q)}」。</p>`;
    }
    box.querySelectorAll("summary[data-island]").forEach(el => el.addEventListener("click", () => selectIsland(+el.dataset.island)));
    box.querySelectorAll("button[data-item]").forEach(el => el.addEventListener("click", () => selectItem(el.dataset.item)));
    box.querySelectorAll("button[data-flow]").forEach(el => el.addEventListener("click", () => selectFlow(+el.dataset.flow)));
    box.querySelectorAll("button[data-harbor]").forEach(el => el.addEventListener("click", selectHarbor));
    box.querySelectorAll("button[data-beacon]").forEach(el => el.addEventListener("click", selectBeacon));
  }
  $("#search").addEventListener("input", renderSide);
  for (const [id, t] of [["#tabTopics", "topics"], ["#tabFlows", "flows"]]) $(id).addEventListener("click", () => {
    tab = t; $("#tabTopics").setAttribute("aria-pressed", t === "topics"); $("#tabFlows").setAttribute("aria-pressed", t === "flows"); renderSide(); });
  renderSide();

  // ---------- 日誌 ----------
  const logList = $("#logList");
  flows.forEach(f => { const o = document.createElement("option"); o.value = f.id; o.textContent = `${f.A.name}→${f.B.name}`; $("#logFilter").append(o); });
  const TAGS = { stop:["停留", "t-stop"], arrive:["抵達", "t-arrive"], handoff:["交接", "t-handoff"], depart:["出發", "t-depart"], commit:["提交", "t-commit"] };
  function addLog(type, text, flowId, time) {
    const li = document.createElement("li"); li.dataset.flow = flowId || "";
    li.innerHTML = `<time>${time || clockStr()}</time><span class="tag ${TAGS[type][1]}">${TAGS[type][0]}</span><span>${esc(text)}</span>`;
    if (type === "commit") logList.append(li); else logList.prepend(li);
    const live = logList.querySelectorAll("li:not([data-flow=''])"); if (live.length > 40) live[live.length - 1].remove();
  }
  DATA.history.forEach(h => addLog("commit", h.text, "", h.date));
  $("#logFilter").addEventListener("change", () => { const v = $("#logFilter").value;
    logList.querySelectorAll("li").forEach(li => li.hidden = !!v && li.dataset.flow !== v); });

  // ---------- HUD 與工具列 ----------
  function syncToggles() {
    document.querySelectorAll("[data-tog]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tog === "paused" ? state.paused : !!state.tog[b.dataset.tog]));
    $("#log").hidden = !state.tog.log;
  }
  document.querySelectorAll("[data-time]").forEach(b => b.addEventListener("click", () => { state.minutes = +b.dataset.time; applyDayNight(); dirty = true; }));
  document.querySelectorAll("[data-tog]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.tog;
    if (k === "paused") state.paused = !state.paused; else state.tog[k] = !state.tog[k];
    if (k === "flows") { if (state.sel?.type === "flow") showFlows([flows[state.sel.i]]); else if (state.sel?.type === "island") showFlows(flowsOf(islands[state.sel.i]));
      else if (state.sel?.type === "item") showFlows(flowsOf(itemById[state.sel.id].island));
      else if (state.sel?.type === "harbor") showFlows(flowsOf(harbor)); else showFlows([]); }
    if (k === "names" && state.tog.names) walkers.forEach(w => { if (!w.name) { const el = document.createElement("div"); el.className = "bubble";
      el.textContent = `正在搬${flows[w.f].cargo}`; w.name = new CSS2DObject(el); w.name.visible = false; scene.add(w.name); } });
    if (k === "bird") { if (state.tog.bird) { controls.minPolarAngle = 0; flyTo(controls.target.clone().add(new V3(.01, 42, 6)), controls.target.clone()); } else goOverview(); }
    syncToggles(); poseWalkers(); dirty = true;
  }));
  $("#btnHome").addEventListener("click", () => { clearSelection(); goOverview(); });
  $("#btnList").addEventListener("click", () => { const side = $("#side"); side.hidden = !side.hidden; $("#btnList").setAttribute("aria-pressed", !side.hidden); });
  $("#hudToggle").addEventListener("click", () => { const open = $("#hud").classList.toggle("open"); $("#hudToggle").setAttribute("aria-expanded", open); });
  if (isMobile) { $("#side").hidden = true; $("#btnList").setAttribute("aria-pressed", "false"); }
  syncToggles();

  // 手機 bottom sheet 拖曳
  document.querySelectorAll(".sheet-handle").forEach(h => {
    const sheet = h.closest(".panel"); let y0 = null, h0 = 0;
    h.addEventListener("pointerdown", e => { y0 = e.clientY; h0 = sheet.getBoundingClientRect().height; h.setPointerCapture(e.pointerId); });
    h.addEventListener("pointermove", e => { if (y0 == null) return; sheet.style.height = Math.min(innerHeight, Math.max(120, h0 + y0 - e.clientY)) + "px"; });
    h.addEventListener("pointerup", e => { if (y0 != null && Math.abs(e.clientY - y0) < 4) sheet.style.height = sheet.getBoundingClientRect().height > innerHeight * .8 ? "" : "100%"; y0 = null; });
  });

  // 鍵盤
  const sph = new THREE.Spherical();
  addEventListener("keydown", e => {
    if (e.target.closest && e.target.closest("input, select, textarea")) return;
    if (e.key === "Escape") { if (!$("#intro").hidden) closeIntro(); else clearSelection(); return; }
    const d = { ArrowLeft:[-.12, 0], ArrowRight:[.12, 0], ArrowUp:[0, -.08], ArrowDown:[0, .08] }[e.key];
    if (!d) return; e.preventDefault(); flight = null;
    const off = camera.position.clone().sub(controls.target); sph.setFromVector3(off);
    sph.theta += d[0]; sph.phi = THREE.MathUtils.clamp(sph.phi + d[1], controls.minPolarAngle, controls.maxPolarAngle);
    camera.position.copy(controls.target).add(new V3().setFromSpherical(sph)); controls.update(); dirty = true;
  });

  // reduced motion
  const rm = matchMedia("(prefers-reduced-motion: reduce)");
  const applyReduced = () => { state.reduced = rm.matches; lineMats.forEach(m => m.uniforms.uStatic.value = state.reduced ? 1 : 0); if (state.reduced) flight = null; dirty = true; };
  rm.addEventListener("change", applyReduced); applyReduced();

  // 說明
  function closeIntro() { $("#intro").hidden = true; store.set("aletheia-island-intro", "1"); }
  $("#introGo").addEventListener("click", closeIntro);
  $("#btnHelp").addEventListener("click", () => { $("#intro").hidden = false; $("#introGo").focus(); });

  // ---------- 標籤碰撞避讓 ----------
  const panelEls = ["#brand", "#tools", "#card", "#side", "#log", "#hud", "#legend"].map(s => $(s));
  function layoutLabels() {
    const blocks = panelEls.filter(el => !el.hidden && getComputedStyle(el).display !== "none").map(el => el.getBoundingClientRect()), placed = [];
    const over = (a, b, m) => a.left < b.right + m && a.right > b.left - m && a.top < b.bottom + m && a.bottom > b.top - m;
    const order = [...islands].sort((a, b) => (b.label.classList.contains("sel") ? 1 : 0) - (a.label.classList.contains("sel") ? 1 : 0));
    for (const s of order) {
      const el = s.label, wasGone = el.classList.contains("gone"), wasNum = el.classList.contains("num"), m = 4;
      el.classList.remove("num", "gone");
      let r = el.getBoundingClientRect();
      const hits = rr => blocks.some(b => over(rr, b, m + (wasNum || wasGone ? 8 : 0))) || placed.some(b => over(rr, b, 2));
      if (hits(r)) { el.classList.add("num"); r = el.getBoundingClientRect(); if (hits(r)) { el.classList.add("gone"); continue; } }
      placed.push(r);
    }
  }

  // ---------- 尺寸 ----------
  function resize() {
    W = stage.clientWidth || innerWidth; H = stage.clientHeight || innerHeight;
    renderer.setSize(W, H); labelRenderer.setSize(W, H); camera.aspect = W / H; camera.updateProjectionMatrix(); dirty = true;
    fwMat.uniforms.uScale.value = H * renderer.getPixelRatio() / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
    spMat.uniforms.uScale.value = fwMat.uniforms.uScale.value;
  }
  new ResizeObserver(resize).observe(stage); resize();
  camera.position.copy(overviewPos()); controls.target.copy(overviewTarget());

  // ---------- 主迴圈 ----------
  applyDayNight(); poseWalkers(); boats.forEach(placeBoat); ferries.forEach(f => placeFerry(f, 0)); skiffs.forEach(placeSkiff); updateBulbs();
  let last = performance.now(), frame = 0, smallVisible = true;
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.max(0, Math.min((now - last) / 1000, .08)); last = now;
    const animating = !state.paused && !state.reduced;
    if (animating) {
      state.time += dt; state.minutes = (state.minutes + dt * 10) % 1440;
      updateWalkers(dt);
      water.material.uniforms.uTime.value = state.time; lineMats.forEach(m => m.uniforms.uTime.value = state.time);
      clouds.forEach(c => { c.position.x += c.userData.speed * dt; if (c.position.x > center.x + 75) c.position.x = center.x - 75; });
      boats.forEach(b => { b.userData.a += b.userData.speed * dt; placeBoat(b); });
      ferries.forEach(f => placeFerry(f, dt));
      skiffs.forEach(g => { g.userData.a += g.userData.speed * dt; placeSkiff(g); });
      updatePods(dt); updateSchools(dt); updateHeli(dt); updateSplashes(dt);
      checkFireworkClock(dt);
      spMat.uniforms.uTime.value = state.time; beam.rotation.y += dt * .7;
      bows.forEach(b => b.tails.forEach((t, k) => { t.rotation.z = Math.sin(state.time * 2.2 + b.phase + k * 1.3) * .14; t.rotation.x = Math.sin(state.time * 1.7 + b.phase) * .1; }));
      if (rockets.length || fw.live || flash.intensity) updateFireworks(dt);
      dirty = true;
    }
    if (flight) { stepFlight(now); dirty = true; }
    if (controls.update()) dirty = true;
    if (!dirty) return;
    applyDayNight();
    poseWalkers();
    updateBulbs();
    const near = camera.position.distanceTo(controls.target) < 26;
    if (near !== smallVisible) { smallVisible = near; smallKit.meshes.forEach(m => m.visible = near); }
    renderer.render(scene, camera); labelRenderer.render(scene, camera);
    if (++frame % 6 === 0) layoutLabels();
    dirty = false;
  }
  requestAnimationFrame(loop);
  requestAnimationFrame(() => {
    $("#loader").classList.add("done");
    if (!store.get("aletheia-island-intro")) { $("#intro").hidden = false; $("#introGo").focus(); }
  });
}
</script>
</body>
</html>
