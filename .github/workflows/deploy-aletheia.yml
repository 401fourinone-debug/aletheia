name: Deploy docs to aletheia.to24tw.com

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-aletheia.yml"
  workflow_dispatch:

concurrency:
  group: deploy-aletheia
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload docs/ via FTPS (explicit TLS)
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" sprx3.coowo.com <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 3
          set net:timeout 30
          mirror --reverse --verbose --only-newer --parallel=4 --delete --exclude-glob .well-known/ ./docs/ ./
          bye
          LFTP
